<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repaso del parcial · Emprendimiento</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap">
<style>
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Plan: el muro de trabajo de un equipo de Design Thinking. Pizarrón punteado, tinta azul marino
   y cuatro colores de post-it que significan siempre lo mismo: la fase del proceso.
   Lo escrito a mano se reserva para las advertencias, como una nota pegada encima. */
:root{
  --ground:#F1F3EE; --dot:#D5DBD3; --surface:#FDFEFC; --ink:#13213A; --soft:#5A687D; --rule:#D3DAD4; --tint:#E6EBE5;
  --n-idear:#FFD84A; --n-prototipar:#FFA98F; --n-testear:#9CCBFF; --n-comunicar:#A6E3AE; --on-note:#13213A;
  --accent:#2457C5; --on-accent:#FDFEFC; --good:#147A4E; --bad:#B72F49;
  --shadow:0 1px 0 rgba(19,33,58,.06),0 10px 24px -14px rgba(19,33,58,.35);
  --display:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0D1520; --dot:#1E2B3B; --surface:#162130; --ink:#EAF0F4; --soft:#9AA9BA; --rule:#2A3A4D; --tint:#1D2A3B;
    --n-idear:#F2CB3F; --n-prototipar:#F29B82; --n-testear:#8BBBEF; --n-comunicar:#93D09C; --on-note:#13213A;
    --accent:#86B4FF; --on-accent:#0D1520; --good:#55D6A0; --bad:#FF8196;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 26px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0D1520; --dot:#1E2B3B; --surface:#162130; --ink:#EAF0F4; --soft:#9AA9BA; --rule:#2A3A4D; --tint:#1D2A3B;
  --n-idear:#F2CB3F; --n-prototipar:#F29B82; --n-testear:#8BBBEF; --n-comunicar:#93D09C; --on-note:#13213A;
  --accent:#86B4FF; --on-accent:#0D1520; --good:#55D6A0; --bad:#FF8196;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 26px -14px rgba(0,0,0,.8);
}
[data-f="idear"]{--f:var(--n-idear)} [data-f="prototipar"]{--f:var(--n-prototipar)}
[data-f="testear"]{--f:var(--n-testear)} [data-f="comunicar"]{--f:var(--n-comunicar)} [data-f="todo"]{--f:var(--tint)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{background:var(--ground);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;color:var(--ink);font:17px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
h1,h2,h3{font-family:var(--display);line-height:1.04;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(40px,7.4vw,72px);font-weight:800}
h2{font-size:clamp(26px,3.6vw,34px);font-weight:800}
h3{font-size:21px;font-weight:700}
p{margin:0} a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.soft{color:var(--soft)}
.cap{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--soft)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1080px;margin:0 auto}
/* barra superior */
.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.bar-top .in{display:flex;align-items:center;gap:10px 18px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:19px;text-decoration:none;display:flex;align-items:center;gap:9px;margin-right:auto}
.brand i{width:18px;height:18px;background:var(--n-idear);box-shadow:5px 5px 0 var(--n-testear);transform:rotate(-6deg);display:block;border-radius:1px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{text-decoration:none;border-radius:999px;padding:7px 14px;font-weight:600;font-size:15.5px;color:var(--soft)}
nav a:hover{color:var(--ink);background:var(--tint)}
nav a[aria-current="page"]{background:var(--ink);color:var(--ground)}
.total{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;border:1.5px solid var(--rule);border-radius:999px;padding:5px 11px;background:var(--surface)}
main{display:grid;gap:36px;padding-block:28px 72px;animation:in .28s ease-out}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.stack{display:grid;gap:16px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--ink);color:var(--ground);border:0;border-radius:999px;padding:11px 20px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.quiet{background:transparent;color:var(--soft);padding-inline:6px;font-weight:600}
.btn.quiet:hover{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--f);color:var(--on-note);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;border-radius:3px;padding:3px 9px}
kbd{font:600 12px var(--body);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:1px 6px;background:var(--surface);color:var(--soft)}
/* inicio */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:end}
.hero .lede{font-size:19px;color:var(--soft);max-width:44ch;margin-top:14px}
.next{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;box-shadow:var(--shadow)}
.ring{width:84px;height:84px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke:var(--tint)}
.ring circle.v{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:21px;font-variant-numeric:tabular-nums}
.route{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;position:relative}
.route::before{content:"";position:absolute;left:4%;right:4%;top:26px;border-top:2.5px dashed var(--soft);opacity:.45}
.note{background:var(--f);color:var(--on-note);padding:16px 16px 14px;display:grid;gap:12px;align-content:start;position:relative;box-shadow:var(--shadow);border-radius:2px 2px 14px 2px;min-width:0}
.route .note:nth-child(odd){transform:rotate(-1.1deg)} .route .note:nth-child(even){transform:rotate(.9deg);margin-top:10px}
.note .n{font-family:var(--hand);font-size:26px;line-height:1;opacity:.7}
.note h3{font-size:25px}
.note small{font-size:13.5px;font-weight:600;opacity:.75}
.meters{display:grid;gap:7px}
.meter{display:grid;grid-template-columns:86px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:13.5px;font-weight:600}
.meter span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.track{height:7px;border-radius:4px;background:rgba(19,33,58,.16);overflow:hidden}
.track i{display:block;height:100%;background:var(--on-note);border-radius:4px}
.note .acts{display:grid;grid-template-columns:repeat(3,auto);gap:5px;justify-content:start}
.note .acts button{background:rgba(19,33,58,.1);border:0;border-radius:999px;padding:6px 9px;font-weight:700;font-size:13.5px;color:var(--on-note);white-space:nowrap}
.note .acts button:hover{background:var(--on-note);color:var(--f)}
.top10{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:22px;display:grid;gap:16px;box-shadow:var(--shadow)}
.top10 ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 28px;counter-reset:t}
.top10 li{counter-increment:t;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.top10 li::before{content:counter(t);font-family:var(--display);font-weight:800;font-size:15px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--tint)}
/* guía */
.guide{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;align-items:start}
.toc{position:sticky;top:calc(76px + env(safe-area-inset-top,0px));display:grid;gap:14px;font-size:15px}
.toc .grp{display:grid;gap:2px}
.toc .cap{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.toc .cap i{width:11px;height:11px;background:var(--f);display:block;border-radius:1px}
.toc a{text-decoration:none;color:var(--soft);padding:4px 8px;border-radius:6px;display:flex;justify-content:space-between;gap:8px}
.toc a:hover{background:var(--tint);color:var(--ink)}
.toc a.read{color:var(--ink)} .toc a.read::after{content:"✓";color:var(--good);font-weight:700}
.ses{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:24px;display:grid;gap:16px;min-width:0;box-shadow:var(--shadow)}
.ses header{display:grid;gap:10px}
.ses .obj{color:var(--soft);font-size:16px;border-left:3px solid var(--f);padding-left:12px}
.ses ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;max-width:70ch}
.ses li{padding-left:20px;position:relative}
.ses li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;background:var(--f);border-radius:1px;transform:rotate(45deg)}
mark{background:linear-gradient(transparent 55%,var(--n-idear) 55%);color:inherit;padding:0 1px;font-weight:600}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) mark{background:none;color:var(--n-idear)}}
:root[data-theme="dark"] mark{background:none;color:var(--n-idear)}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15.5px;min-width:460px}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);background:var(--tint)}
td:first-child{font-weight:700;white-space:nowrap}
.ojo{justify-self:start;max-width:56ch;background:var(--f);color:var(--on-note);font-family:var(--hand);font-size:23px;line-height:1.15;padding:10px 16px 12px;transform:rotate(-.8deg);box-shadow:var(--shadow);border-radius:2px 2px 12px 2px}
.ojo b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.ses footer{display:flex;justify-content:flex-end}
.readbtn{background:transparent;border:1.5px solid var(--rule);border-radius:999px;padding:7px 14px;font-weight:700;font-size:15px}
.readbtn:hover{border-color:var(--ink)}
.readbtn[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
/* menús */
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.legend>div{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px;display:grid;gap:8px}
.legend .tiles{min-height:0;gap:3px}
.legend .tile{width:22px;height:30px;font-size:16px;border-bottom-width:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--rule);border-top:8px solid var(--f);border-radius:4px 4px 14px 14px;padding:16px 16px 18px;display:grid;gap:16px;align-content:space-between;box-shadow:var(--shadow)}
.card small{color:var(--soft);display:block;font-weight:500}
.card.wide{grid-column:1/-1;grid-template-columns:minmax(0,1fr) minmax(0,340px);align-items:center;border-top-color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.steps button{border:1.5px solid var(--rule);background:transparent;border-radius:10px;padding:8px 4px;display:grid;gap:2px;justify-items:center;font-size:12.5px;font-weight:600;color:var(--soft);line-height:1.2}
.steps button b{font-family:var(--display);font-size:20px;color:var(--ink);line-height:1}
.steps button:hover{border-color:var(--ink);color:var(--ink)}
.steps button.done{background:var(--f);border-color:var(--f);color:var(--on-note)} .steps button.done b{color:var(--on-note)}
.steps button.done b::after{content:" ✓";font-size:14px}
.pair{display:grid;gap:8px}
.wide .pair{grid-template-columns:repeat(2,minmax(0,1fr))}
.pair button{border:1.5px solid var(--rule);background:transparent;border-radius:10px;padding:9px 12px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:8px;text-align:left}
.pair button span{color:var(--soft);font-weight:600;font-variant-numeric:tabular-nums}
.pair button:hover{border-color:var(--ink)}
/* escenario de práctica y preguntas */
.stage{max-width:720px;width:100%;margin:0 auto;background:var(--surface);border:1px solid var(--rule);border-top:8px solid var(--f);border-radius:4px 4px 16px 16px;padding:22px 24px 26px;display:grid;gap:18px;box-shadow:var(--shadow)}
.stage .head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.segs{display:flex;gap:3px}
.segs i{flex:1;height:7px;border-radius:4px;background:var(--tint);min-width:0}
.segs i.ok{background:var(--good)} .segs i.bad{background:var(--bad)} .segs i.now{background:var(--ink)}
.count{display:flex;justify-content:space-between;font-size:14px;color:var(--soft);font-weight:600;font-variant-numeric:tabular-nums}
.clue{font-family:var(--display);font-size:clamp(21px,3.2vw,27px);font-weight:500;line-height:1.25;text-wrap:pretty;letter-spacing:-.005em}
.tiles{display:flex;flex-wrap:wrap;gap:8px 18px;min-height:46px}
.tiles .w{display:flex;gap:4px;flex-wrap:wrap}
.tile{width:28px;height:40px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase;background:var(--tint);border-bottom:3px solid var(--ink);border-radius:3px 3px 0 0}
.tile.gap{background:transparent;border:1.5px dashed var(--rule);border-bottom:3px solid var(--soft)}
.tiles.ok .tile{background:color-mix(in srgb,var(--good) 16%,var(--surface));border-bottom-color:var(--good);color:var(--good);animation:pop .3s}
.tiles.shown .tile{background:var(--f);color:var(--on-note);border-bottom-color:var(--on-note)}
@keyframes pop{50%{transform:translateY(-4px)}}
form{display:flex;gap:8px}
input[type=text],textarea{flex:1;min-width:0;width:100%;font:600 19px var(--body);color:var(--ink);background:var(--ground);border:2px solid var(--ink);border-radius:12px;padding:12px 14px}
input[type=text]::placeholder,textarea::placeholder{color:var(--soft);font-weight:400}
textarea{font-weight:400;font-size:17px;min-height:120px;resize:vertical;line-height:1.5}
.fb{min-height:26px;font-weight:700}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.hint{font-size:13.5px;color:var(--soft);display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.shake{animation:shake .28s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.q{font-family:var(--display);font-size:clamp(21px,3.2vw,26px);font-weight:700;line-height:1.22;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--ground);border:1.5px solid var(--rule);border-radius:12px;padding:12px 14px;transition:border-color .12s,transform .12s}
.opt b{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:var(--surface);border:1px solid var(--rule);font-family:var(--display)}
.opt:hover:not(:disabled){border-color:var(--ink);transform:translateX(2px)}
.opt:disabled{cursor:default;color:var(--soft)}
.opt.right{border-color:var(--good);border-width:2px;color:var(--ink);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.opt.right b{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);border-width:2px;color:var(--ink);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
.opt.wrong b{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.retro{border-left:4px solid var(--accent);background:var(--ground);padding:12px 16px;border-radius:0 10px 10px 0;display:grid;gap:6px}
.retro.good{border-left-color:var(--good)} .retro.bad{border-left-color:var(--bad)}
.retro ul{margin:0;padding-left:20px;display:grid;gap:4px}
.mine{border:1.5px dashed var(--rule);border-radius:10px;padding:12px 14px;white-space:pre-wrap}
.result{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.result .ring{width:112px;height:112px} .result .ring b{font-size:30px}
.result .ring circle.v{stroke:var(--good)}
.fails{margin:0;padding-left:22px;display:grid;gap:14px}
.fails li p+p{margin-top:3px}
footer.site{border-top:1px solid var(--rule);padding-block:16px 0;color:var(--soft);font-size:14.5px;max-width:80ch}
@media (max-width:900px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .route{grid-template-columns:repeat(2,minmax(0,1fr))} .route::before{display:none}
  .guide{grid-template-columns:minmax(0,1fr);gap:18px}
  .toc{position:static;display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
  .toc .grp{display:flex;gap:4px;align-items:center;flex:none} .toc .cap{margin:0} .toc .cap span{display:none}
  .toc a{white-space:nowrap;border:1px solid var(--rule);background:var(--surface);padding:4px 10px}
}
@media (max-width:600px){
  body{font-size:16.5px}
  .route,.legend,.top10 ol,.card.wide{grid-template-columns:minmax(0,1fr)}
  .route .note{transform:none!important;margin-top:0!important}
  .ses,.stage,.top10{padding:18px 16px}
  .tile{width:23px;height:35px;font-size:18px} .tiles{gap:8px 14px}
  .result{grid-template-columns:minmax(0,1fr);justify-items:start}
  .brand span{display:none}
  .bar-top .in{gap:8px}
  .total{order:2}
  nav{order:3;flex-basis:100%;justify-content:space-between}
  nav a{padding:6px 10px;font-size:15px}
  html{scroll-padding-top:calc(112px + env(safe-area-inset-top,0px))}
  form{flex-direction:column} form .btn{justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>

</head>
<body>
<div class="bar-top gut"><div class="in">
  <a class="brand" href="#inicio"><i></i><span>Repaso del parcial</span></a>
  <nav id="nav">
    <a href="#inicio">Inicio</a><a href="#guia">Guía</a><a href="#practica">Práctica</a><a href="#cuestionario">Cuestionario</a>
  </nav>
  <span class="total" id="total" title="Avance total">0 %</span>
</div></div>
<div class="gut"><div class="in">
  <main id="app"></main>
  <footer class="site">Hecho con las presentaciones del profesor de las sesiones 16, 17, 18, 19, 20, 21, 22, 24, 25 y 26. No incluye la sesión 23 ni las anteriores a la 16. Tu avance se guarda solo en este navegador.</footer>
</div></div>

<script>
"use strict";
/* ===================== CONTENIDO ===================== */
const BLOQUES=[
 {id:"idear",nombre:"Idear",ses:"Sesiones 16 a 18"},
 {id:"prototipar",nombre:"Prototipar",ses:"Sesiones 19 y 20"},
 {id:"testear",nombre:"Testear",ses:"Sesiones 21 y 22"},
 {id:"comunicar",nombre:"Comunicar",ses:"Sesiones 24 a 26"}
];

const TOP=[
 "Las 8 técnicas de ideación y qué busca cada una (S16).",
 "Divergir = generar muchas ideas; converger = elegir con criterios (S17).",
 "Deseabilidad, factibilidad y viabilidad: qué pregunta responde cada una (S17 y S18).",
 "Prototipo: ensayo rápido y barato para aprender del usuario; “fallar rápido y barato” (S19).",
 "Los tres niveles de fidelidad y para qué sirve cada uno (S19 y S20).",

/* ===================== UTILIDADES ===================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem("emp-"+k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem("emp-"+k,JSON.stringify(v));}catch(e){}}};
const nombreBloque=id=>id==="todo"?"Todo mezclado":BLOQUES.find(b=>b.id===id).nombre;
const filtra=(arr,idx,b)=>b==="todo"?arr:arr.filter(x=>x[idx]===b);
const sid=s=>"s"+s.t.match(/\d+/)[0];
const RONDAS=["Nombre visible","Letras ocultas","Todo oculto"];
let vista={},pendiente=null;
const ring=(p,txt)=>{const c=2*Math.PI*26;return `<div class="ring"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26"/><circle class="v" cx="32" cy="32" r="26" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p)).toFixed(1)}"/></svg><b>${txt}</b></div>`;};
function ir(hash,fn){pendiente=fn||null;if(location.hash==="#"+hash)ruta();else location.hash=hash;}

/* ===================== AVANCE ===================== */
function prog(id){
  const le=store.get("leidas",{}),ro=store.get("rondas",{}),mc=store.get("mc",{});
  const ses=GUIA.filter(g=>g.b===id);
  return {leer:[ses.filter(s=>le[sid(s)]).length,ses.length],rondas:[[1,2,3].filter(r=>ro[id+r]).length,3],quiz:[mc[id]||0,filtra(MC,4,id).length]};
}
function avanceTotal(){
  let s=0;for(const b of BLOQUES){const p=prog(b.id);s+=(p.leer[0]/p.leer[1]+p.rondas[0]/p.rondas[1]+p.quiz[0]/p.quiz[1])/3;}
  return s/BLOQUES.length;
}
function pintaTotal(){$("#total").textContent=Math.round(avanceTotal()*100)+" %";}
function sugerencia(){
  const ro=store.get("rondas",{}),mc=store.get("mc",{});
  for(const b of BLOQUES){const p=prog(b.id);if(p.leer[0]<p.leer[1])return {t:"Leer la guía de "+b.nombre,d:`Te faltan ${p.leer[1]-p.leer[0]} de ${p.leer[1]} sesiones por marcar como repasadas.`,go:()=>ir("guia",()=>saltaA(b.id))};}
  for(const b of BLOQUES)for(const r of [1,2,3])if(!ro[b.id+r])return {t:`${b.nombre}: ronda ${r}`,d:RONDAS[r-1]+". Complétala sin fallos para marcarla.",go:()=>ir("practica",()=>iniciaRonda(b.id,r))};
  for(const b of BLOQUES)if(mc[b.id]==null||mc[b.id]<filtra(MC,4,b.id).length)return {t:"Cuestionario de "+b.nombre,d:"Opción múltiple con explicación en cada pregunta.",go:()=>ir("cuestionario",()=>iniciaMC(b.id))};
  return {t:"Cuestionario mezclado",d:"Ya cubriste todo. Un último repaso con las 43 preguntas.",go:()=>ir("cuestionario",()=>iniciaMC("todo"))};
}

  const s=sugerencia(),tot=avanceTotal();
  const m=(l,[a,b])=>`<div class="meter"><span>${l}</span><div class="track"><i style="width:${(a/b*100).toFixed(0)}%"></i></div><span>${a}/${b}</span></div>`;
  app.innerHTML=`
  <section class="hero">
    <div><p class="cap">Emprendimiento · sesiones 16 a 26</p><h1>Repaso del parcial</h1>
      <p class="lede">Cuatro fases del proceso, de la primera idea al pitch. Lee la guía, escribe los términos de memoria y ponte a prueba.</p></div>
    <div class="next">${ring(tot,Math.round(tot*100)+"%")}<div class="stack" style="gap:8px"><p class="cap">Siguiente paso</p><h3>${esc(s.t)}</h3><p class="soft" style="font-size:15px">${esc(s.d)}</p><div><button class="btn" id="go">Empezar</button></div></div></div>
  </section>
  <section class="stack"><h2>El recorrido</h2>
    <div class="route">${BLOQUES.map((b,i)=>{const p=prog(b.id);return `<article class="note" data-f="${b.id}"><div><span class="n">fase ${i+1}</span><h3>${b.nombre}</h3><small>${b.ses}</small></div>
      <div class="meters">${m("Guía",p.leer)}${m("Rondas",p.rondas)}${m("Preguntas",p.quiz)}</div>
      <div class="acts"><button data-a="leer" data-b="${b.id}">Leer</button><button data-a="prac" data-b="${b.id}">Practicar</button><button data-a="quiz" data-b="${b.id}">Preguntas</button></div></article>`;}).join("")}</div>
  </section>
  <section class="top10"><div><p class="cap">Si solo tienes diez minutos</p><h2>Lo más probable en el examen</h2></div><ol>${TOP.map(t=>`<li><span>${t}</span></li>`).join("")}</ol></section>`;
  $("#go").onclick=s.go;
  $$(".acts button").forEach(x=>x.onclick=()=>{const b=x.dataset.b,a=x.dataset.a;
    if(a==="leer")ir("guia",()=>saltaA(b));

    else ir("cuestionario",()=>iniciaMC(b));});
}

/* ===================== GUÍA ===================== */
function saltaA(b){const el=$("#f-"+b);if(el)el.scrollIntoView();}
function verGuia(){
  const le=store.get("leidas",{});
  const toc=BLOQUES.map(b=>`<div class="grp" data-f="${b.id}"><p class="cap"><i></i><span>${b.nombre}</span></p>${GUIA.filter(g=>g.b===b.id).map(s=>`<a href="#" data-s="${sid(s)}" class="${le[sid(s)]?"read":""}">${s.t.split(" · ")[0]}</a>`).join("")}</div>`).join("");
  let h="";
  for(const b of BLOQUES){
    h+=`<div class="stack" id="f-${b.id}" data-f="${b.id}" style="gap:18px"><div class="row"><span class="chip">${b.ses}</span><h2>${b.nombre}</h2></div>`;
    for(const s of GUIA.filter(g=>g.b===b.id)){
      const [n,t]=s.t.split(" · "),id=sid(s);
      h+=`<article class="ses" id="${id}"><header><p class="cap">${n}</p><h3 style="font-size:26px">${t}</h3><p class="obj">${s.obj}</p></header><ul>${s.pts.map(p=>`<li>${p}</li>`).join("")}</ul>`;
      if(s.tabla)h+=`<div class="tablewrap"><table><thead><tr>${s.tabla.h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${s.tabla.r.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</tbody></table></div>`;
      h+=`<p class="ojo"><b>Ojo:</b> ${s.trap}</p><footer><button class="readbtn" data-s="${id}" aria-pressed="${le[id]?"true":"false"}">${le[id]?"Repasada ✓":"Marcar como repasada"}</button></footer></article>`;
    }
    h+=`</div>`;
  }
  app.innerHTML=`<div class="stack" style="max-width:60ch"><h2>Guía por sesión</h2><p class="soft">Lo que dice cada presentación, reducido a lo que se puede preguntar. Marca cada sesión cuando la tengas clara.</p></div><div class="guide"><aside class="toc" aria-label="Sesiones">${toc}</aside><div class="stack" style="gap:40px">${h}</div></div>`;
  $$(".toc a").forEach(a=>a.onclick=e=>{e.preventDefault();$("#"+a.dataset.s).scrollIntoView();});
  $$(".readbtn").forEach(bt=>bt.onclick=()=>{const l=store.get("leidas",{}),id=bt.dataset.s;if(l[id])delete l[id];else l[id]=1;store.set("leidas",l);
    bt.setAttribute("aria-pressed",l[id]?"true":"false");bt.textContent=l[id]?"Repasada ✓":"Marcar como repasada";$(`.toc a[data-s="${id}"]`).classList.toggle("read",!!l[id]);pintaTotal();});
}

/* ===================== PRÁCTICA ===================== */
function fichas(term,r,revelar){
  return term.split(" ").map(w=>`<span class="w">${[...w].map((c,i)=>{
    if(!/[a-zA-Z0-9áéíóúñÁÉÍÓÚÑ]/.test(c))return `<span class="tile">${esc(c)}</span>`;
    const ver=revelar||r===1||(r===2&&(i===0||i%3===2));
    return `<span class="tile${ver?"":" gap"}">${ver?esc(c):""}</span>`;}).join("")}</span>`).join("");
}
function verPractica(){
  vista={};
  const hecho=store.get("rondas",{});
  const tarjeta=(id,nombre,sub,n)=>`<div class="card${id==="todo"?" wide":""}" data-f="${id}"><div><h3>${nombre}</h3><small>${sub} · ${n} términos</small></div><div class="steps">${[1,2,3].map(r=>`<button type="button" data-b="${id}" data-r="${r}" class="${hecho[id+r]?"done":""}" aria-label="${nombre}, ronda ${r}: ${RONDAS[r-1]}${hecho[id+r]?", completada":""}"><b>${r}</b>${RONDAS[r-1]}</button>`).join("")}</div></div>`;
  app.innerHTML=`<div class="stack" style="max-width:62ch"><h2>Práctica por rondas</h2><p class="soft">Lees la definición y escribes el término. Cada ronda esconde más. No cuentan acentos, mayúsculas ni apóstrofos.</p></div>
  <div class="legend">${[1,2,3].map(r=>`<div><p class="cap">Ronda ${r} · ${RONDAS[r-1]}</p><div class="tiles">${fichas("Pitch",r,false)}</div></div>`).join("")}</div>
  <div class="cards">${BLOQUES.map(b=>tarjeta(b.id,b.nombre,b.ses,filtra(TERMS,2,b.id).length)).join("")}${tarjeta("todo","Todo mezclado","Sesiones 16 a 26",TERMS.length)}</div>`;
  $$(".steps button").forEach(x=>x.onclick=()=>iniciaRonda(x.dataset.b,+x.dataset.r));
}
function iniciaRonda(b,r,solo){
  const cola=shuffle(solo||filtra(TERMS,2,b));
  vista={modo:"ronda",b,r,cola,i:0,fallos:[],estado:cola.map(()=>""),intentos:0,mostrado:false,racha:0,completa:!solo};
  pintaTermino();
}
const segs=v=>`<div class="segs">${v.estado.map((e,k)=>`<i class="${e||(k===v.i?"now":"")}"></i>`).join("")}</div>`;
function pintaTermino(){
  const v=vista,t=v.cola[v.i];
  if(!t)return finRonda();
  v.intentos=0;v.mostrado=false;
  app.innerHTML=`<section class="stage" data-f="${v.b}">
   <div class="head"><button class="btn quiet" id="back">← Rondas</button><span class="chip">${nombreBloque(v.b)} · ronda ${v.r}</span></div>
   ${segs(v)}<div class="count"><span>${v.i+1} de ${v.cola.length}</span><span>${v.racha>1?"Racha de "+v.racha:RONDAS[v.r-1]}</span></div>
   <p class="clue">${esc(t[1])}</p>
   <div class="tiles" id="tiles">${fichas(t[0],v.r,false)}</div>
   <form id="f" autocomplete="off"><input type="text" id="resp" aria-label="Escribe el término" placeholder="Escribe el término" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn">Revisar</button></form>
   <p class="fb" id="fb" aria-live="polite"></p>
   <div class="hint"><span><kbd>Enter</kbd> revisa</span><button type="button" class="btn quiet" id="ver">No lo sé, muéstralo</button></div></section>`;
  $("#resp").focus();
  $("#f").onsubmit=e=>{e.preventDefault();revisa();};
  $("#ver").onclick=muestra;$("#back").onclick=verPractica;
}
function muestra(){
  const v=vista,t=v.cola[v.i];
  if(!v.mostrado){v.mostrado=true;v.racha=0;if(!v.fallos.includes(t))v.fallos.push(t);}
  const ti=$("#tiles");ti.innerHTML=fichas(t[0],v.r,true);ti.className="tiles shown";
  $("#fb").className="fb bad";$("#fb").textContent="Es “"+t[0]+"”. Escríbelo para continuar.";
  $("#resp").value="";$("#resp").focus();
}
function revisa(){
  const v=vista,t=v.cola[v.i],inp=$("#resp"),r=norm(inp.value);
  if(!r||inp.disabled)return;
  const ok=[t[0],...(t[3]||[])].some(a=>norm(a)===r);
  if(ok){
    const ti=$("#tiles");ti.innerHTML=fichas(t[0],v.r,true);ti.className="tiles ok";
    v.estado[v.i]=v.mostrado?"bad":"ok";if(!v.mostrado)v.racha++;
    $("#fb").className="fb good";$("#fb").textContent=v.mostrado?"Bien. Volverá a salir al final.":"Correcto";
    inp.disabled=true;setTimeout(()=>{if(vista===v){v.i++;pintaTermino();}},650);
  }else{
    v.intentos++;inp.classList.remove("shake");void inp.offsetWidth;inp.classList.add("shake");
    if(v.intentos>=2&&!v.mostrado)muestra();
    else if(!v.mostrado){$("#fb").className="fb bad";$("#fb").textContent="No es. Te queda un intento.";inp.select();}
    else inp.select();
  }
}
function finRonda(){
  const v=vista,n=v.cola.length,bien=n-v.fallos.length;
  if(!v.fallos.length&&v.completa){const h=store.get("rondas",{});h[v.b+v.r]=1;store.set("rondas",h);pintaTotal();}
  const msg=!v.fallos.length?(v.completa?"Ronda completa sin fallos. Queda marcada.":"Ya salieron todas las que fallaste."):"Repite las que fallaste antes de subir de ronda.";
  app.innerHTML=`<section class="stage" data-f="${v.b}"><div class="head"><span class="chip">${nombreBloque(v.b)} · ronda ${v.r}</span></div>
   <div class="result">${ring(bien/n,bien+"/"+n)}<div class="stack" style="gap:6px"><h2>${bien===n?"Sin ayuda":bien>=n*.7?"Casi":"Hay que repetir"}</h2><p class="soft">${msg}</p></div></div>
   ${v.fallos.length?`<div class="retro bad"><b>Para repasar</b><ul>${v.fallos.map(t=>`<li><b>${esc(t[0])}:</b> ${esc(t[1])}</li>`).join("")}</ul></div>`:""}
   <div class="row">${v.fallos.length?`<button class="btn" id="rep">Repetir las falladas</button>`:""}${v.r<3?`<button class="btn${v.fallos.length?" ghost":""}" id="sig">Ronda ${v.r+1}: ${RONDAS[v.r].toLowerCase()}</button>`:""}<button class="btn ghost" id="back">Volver a las rondas</button></div></section>`;
  const f=v.fallos.slice();
  if($("#rep"))$("#rep").onclick=()=>iniciaRonda(v.b,v.r,f);
  if($("#sig"))$("#sig").onclick=()=>iniciaRonda(v.b,v.r+1);
  $("#back").onclick=verPractica;
  ($("#rep")||$("#sig")||$("#back")).focus();
}

/* ===================== CUESTIONARIO ===================== */
function verCuestionario(){
  vista={};
  const best=store.get("mc",{});
  const tarjeta=(id,nombre,sub)=>{const nm=filtra(MC,4,id).length,na=filtra(AB,2,id).length;
    return `<div class="card${id==="todo"?" wide":""}" data-f="${id}"><div><h3>${nombre}</h3><small>${sub}${best[id]!=null?` · mejor: ${best[id]} de ${nm}`:""}</small></div><div class="pair"><button type="button" data-b="${id}" data-m="mc">Opción múltiple <span>${nm}</span></button><button type="button" data-b="${id}" data-m="ab">Preguntas abiertas <span>${na}</span></button></div></div>`;};
  app.innerHTML=`<div class="stack" style="max-width:62ch"><h2>Cuestionario</h2><p class="soft">Contestas primero y después ves la respuesta. En opción múltiple hay explicación en cada pregunta; en las abiertas escribes de memoria y comparas con los puntos clave.</p></div>
  <div class="cards">${BLOQUES.map(b=>tarjeta(b.id,b.nombre,b.ses)).join("")}${tarjeta("todo","Todo mezclado","Sesiones 16 a 26")}</div>`;
  $$(".pair button").forEach(x=>x.onclick=()=>x.dataset.m==="mc"?iniciaMC(x.dataset.b):iniciaAB(x.dataset.b));
}
function iniciaMC(b,solo){const cola=shuffle(solo||filtra(MC,4,b));vista={modo:"mc",b,cola,i:0,ok:0,fallos:[],estado:cola.map(()=>""),completo:!solo,resuelta:false};pintaMC();}
function pintaMC(){
  const v=vista,q=v.cola[v.i];
  if(!q)return finMC();
  v.resuelta=false;
  const orden=shuffle(q[1].map((_,i)=>i));
  app.innerHTML=`<section class="stage" data-f="${q[4]}">
   <div class="head"><button class="btn quiet" id="back">← Cuestionarios</button><span class="chip">${nombreBloque(q[4])}</span></div>
   ${segs(v)}<div class="count"><span>Pregunta ${v.i+1} de ${v.cola.length}</span><span>${v.ok} correctas</span></div>
   <p class="q">${esc(q[0])}</p>
   <div class="opts">${orden.map((o,k)=>`<button type="button" class="opt" data-o="${o}"><b>${"ABCD"[k]}</b><span>${esc(q[1][o])}</span></button>`).join("")}</div>
   <div id="retro" aria-live="polite" class="stack"><p class="hint"><span><kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> <kbd>D</kbd> para responder</span></p></div></section>`;
  $("#back").onclick=verCuestionario;
  $$(".opt").forEach(bt=>bt.onclick=()=>{
    if(v.resuelta)return;v.resuelta=true;
    const pick=+bt.dataset.o,bien=pick===q[2];
    $$(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.o===q[2])x.classList.add("right");});
    if(bien)v.ok++;else{bt.classList.add("wrong");v.fallos.push(q);}
    v.estado[v.i]=bien?"ok":"bad";
    $("#retro").innerHTML=`<div class="retro ${bien?"good":"bad"}"><p class="fb ${bien?"good":"bad"}">${bien?"Correcto":"Incorrecto"}</p><p>${esc(q[3])}</p></div><div class="row"><button class="btn" id="next">${v.i+1<v.cola.length?"Siguiente":"Ver resultado"}</button><span class="hint"><kbd>Enter</kbd></span></div>`;
    $("#next").onclick=()=>{v.i++;pintaMC();};$("#next").focus();
  });
}
document.addEventListener("keydown",e=>{
  if(vista.modo!=="mc"||vista.resuelta||e.metaKey||e.ctrlKey||e.altKey)return;
  const k="abcd".indexOf(e.key.toLowerCase()),n="1234".indexOf(e.key),i=k>=0?k:n;
  const o=$$(".opt");if(i>=0&&o[i]){e.preventDefault();o[i].click();}
});
function finMC(){
  const v=vista,n=v.cola.length;v.modo="";
  if(v.completo){const b=store.get("mc",{});if(b[v.b]==null||v.ok>b[v.b]){b[v.b]=v.ok;store.set("mc",b);}
    if(v.b==="todo"){for(const bl of BLOQUES){const sub=v.cola.filter(q=>q[4]===bl.id),ok=sub.filter(q=>!v.fallos.includes(q)).length;if(b[bl.id]==null||ok>b[bl.id])b[bl.id]=ok;}store.set("mc",b);}pintaTotal();}
  app.innerHTML=`<section class="stage" data-f="${v.b}"><div class="head"><span class="chip">${nombreBloque(v.b)} · opción múltiple</span></div>
   <div class="result">${ring(v.ok/n,v.ok+"/"+n)}<div class="stack" style="gap:6px"><h2>${v.ok===n?"Todo correcto":v.ok>=n*.8?"Vas bien":v.ok>=n*.6?"A medias":"Hay que volver a la guía"}</h2><p class="soft">${v.fallos.length?"Abajo está cada pregunta fallada con su respuesta.":"No fallaste ninguna."}</p></div></div>
   ${v.fallos.length?`<ol class="fails">${v.fallos.map(q=>`<li><p><b>${esc(q[0])}</b></p><p>${esc(q[1][q[2]])}</p><p class="soft">${esc(q[3])}</p></li>`).join("")}</ol>`:""}
   <div class="row">${v.fallos.length?`<button class="btn" id="rep">Repetir las falladas</button>`:""}<button class="btn ghost" id="otra">Repetir todo</button><button class="btn ghost" id="back">Volver</button></div></section>`;
  const f=v.fallos.slice();
  if($("#rep"))$("#rep").onclick=()=>iniciaMC(v.b,f);
  $("#otra").onclick=()=>iniciaMC(v.b);$("#back").onclick=verCuestionario;
}
function iniciaAB(b){const cola=shuffle(filtra(AB,2,b));vista={modo:"ab",b,cola,i:0,ok:0,fallos:[],estado:cola.map(()=>"")};pintaAB();}
function pintaAB(){
  const v=vista,q=v.cola[v.i];
  if(!q)return finAB();
  app.innerHTML=`<section class="stage" data-f="${q[2]}">
   <div class="head"><button class="btn quiet" id="back">← Cuestionarios</button><span class="chip">${nombreBloque(q[2])}</span></div>
   ${segs(v)}<div class="count"><span>Abierta ${v.i+1} de ${v.cola.length}</span><span>${v.ok} completas</span></div>
   <p class="q">${esc(q[0])}</p>
   <div id="zona" class="stack"><textarea id="txt" aria-label="Tu respuesta" placeholder="Escribe lo que recuerdes, sin ver la guía"></textarea><div class="row"><button class="btn" id="cmp">Comparar con la respuesta</button></div></div></section>`;
  $("#txt").focus();$("#back").onclick=verCuestionario;
  $("#cmp").onclick=()=>{
    const mio=$("#txt").value.trim();
    $("#zona").innerHTML=`<p class="cap">Tu respuesta</p><div class="mine">${mio?esc(mio):"(sin respuesta)"}</div>
     <div class="retro"><b>Puntos clave que debe tener</b><ul>${q[1].map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>
     <p><b>¿Cómo te fue?</b></p><div class="row"><button class="btn" id="si">Los tuve todos</button><button class="btn ghost" id="no">Me faltó algo</button></div>`;
    $("#si").onclick=()=>{v.estado[v.i]="ok";v.ok++;v.i++;pintaAB();};
    $("#no").onclick=()=>{v.estado[v.i]="bad";v.fallos.push(q);v.i++;pintaAB();};
  };
}
function finAB(){
  const v=vista,n=v.cola.length;
  app.innerHTML=`<section class="stage" data-f="${v.b}"><div class="head"><span class="chip">${nombreBloque(v.b)} · abiertas</span></div>
   <div class="result">${ring(v.ok/n,v.ok+"/"+n)}<div class="stack" style="gap:6px"><h2>${v.ok===n?"Todas completas":"Para volver a escribir"}</h2><p class="soft">${v.fallos.length?"Vuelve a escribir estas hasta que salgan sin ver.":"Tuviste todos los puntos clave."}</p></div></div>
   ${v.fallos.length?`<ol class="fails">${v.fallos.map(q=>`<li><p><b>${esc(q[0])}</b></p><ul>${q[1].map(p=>`<li>${esc(p)}</li>`).join("")}</ul></li>`).join("")}</ol>`:""}
   <div class="row"><button class="btn" id="otra">Repetir</button><button class="btn ghost" id="back">Volver</button></div></section>`;
  $("#otra").onclick=()=>iniciaAB(v.b);$("#back").onclick=verCuestionario;
}

/* ===================== RUTAS ===================== */
const VISTAS={inicio:verInicio,guia:verGuia,practica:verPractica,cuestionario:verCuestionario};
function ruta(){
  const h=(location.hash||"#inicio").slice(1),r=VISTAS[h]?h:"inicio";
  $$("#nav a").forEach(a=>a.getAttribute("href")==="#"+r?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  vista={};window.scrollTo(0,0);VISTAS[r]();pintaTotal();
  app.style.animation="none";void app.offsetWidth;app.style.animation="";
  if(pendiente){const f=pendiente;pendiente=null;f();}
}
window.addEventListener("hashchange",ruta);
$$("#nav a,.brand").forEach(a=>a.addEventListener("click",()=>{if(location.hash===a.getAttribute("href"))ruta();}));
ruta();
</script>
